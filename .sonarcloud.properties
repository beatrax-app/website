# SonarCloud automatic-analysis configuration.
#
# Copy-paste detection adds no signal on the locale dictionaries. en.ts and
# nl.ts (and pages-en.ts / pages-nl.ts, cards.ts) are deliberately parallel:
# both locales define the same keys so the type system guarantees neither can
# drift from the other, which makes them read as ~99% duplicated to CPD. That
# duplication is the design, not a defect, so exclude the locale files from
# duplication detection only — every other analysis (bugs, vulnerabilities,
# maintainability) still runs across them.
sonar.cpd.exclusions=src/i18n/**
